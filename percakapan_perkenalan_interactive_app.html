<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Percakapan Perkenalan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        /* Pulse wave for microphone active state */
        @keyframes mic-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .animate-mic {
            animation: mic-pulse 1.6s infinite ease-in-out;
        }

        /* Star bounce animation */
        @keyframes star-pop {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.25) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-star {
            animation: star-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .star-delay-1 { animation-delay: 0.1s; }
        .star-delay-2 { animation-delay: 0.25s; }
        .star-delay-3 { animation-delay: 0.4s; }

        /* Bubble appearance animation */
        @keyframes bubble-slide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-bubble {
            animation: bubble-slide 0.35s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between items-center antialiased">

    <!-- Top Header Navigation -->
    <header class="w-full max-w-3xl bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center justify-between gap-4 max-w-2xl mx-auto">
            <!-- Close / Reset Button -->
            <button id="btn-close" title="Ulangi Percakapan" class="w-10 h-10 flex items-center justify-center rounded-full text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <!-- Progress Bar Bar -->
            <div class="flex-1 bg-slate-100 h-3.5 rounded-full overflow-hidden relative border border-slate-200/60">
                <div id="progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-500 ease-out" style="width: 10%;"></div>
            </div>

            <!-- Counter & Translation Toggle -->
            <div class="flex items-center gap-3">
                <span id="step-counter" class="text-sm font-extrabold text-slate-700 tracking-wide min-w-[36px] text-center">1/10</span>
                <button id="btn-toggle-trans" title="Tampilkan/Sembunyikan Terjemahan" class="p-2 rounded-xl border border-slate-200 text-slate-600 hover:border-amber-400 hover:text-amber-600 hover:bg-amber-50/50 transition flex items-center gap-1 font-bold text-sm">
                    <span class="text-lg leading-none">文</span><span class="text-sm leading-none font-extrabold">A</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Scrollable Chat Area -->
    <main class="flex-1 w-full max-w-2xl px-4 py-6 flex flex-col justify-start gap-6 pb-28">
        <!-- Notification Banner / Speed toggle -->
        <div class="flex items-center justify-between text-xs text-slate-500 bg-white/80 backdrop-blur border border-slate-200/80 rounded-2xl px-4 py-2 shadow-sm">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-amber-500"></i>
                <span>Latihan pengucapan percakapan perkenalan (English)</span>
            </div>
            <button id="btn-toggle-speed" class="font-bold text-slate-600 hover:text-amber-600 transition flex items-center gap-1">
                <i class="fa-solid fa-gauge-high"></i>
                <span id="speed-label">Kecepatan: 0.9x</span>
            </button>
        </div>

        <!-- Dynamic Chat History Container -->
        <div id="chat-container" class="flex flex-col gap-6 w-full">
            <!-- Dynamic chats injected via JS -->
        </div>
    </main>

    <!-- Floating Quick Help / Audio Indicator -->
    <div id="recording-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full shadow-2xl border border-slate-700 flex items-center gap-3 opacity-0 pointer-events-none transition-all duration-300 z-40">
        <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
        <span id="toast-text" class="text-sm font-semibold">Sedang mendengarkan... Katakan kalimatnya!</span>
    </div>

    <!-- Restart / Completion Modal -->
    <div id="modal-completion" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modal-card">
            <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                🏆
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800">Selesai & Luar Biasa!</h2>
            <p class="text-slate-500 mt-1 text-sm">Kamu telah menyelesaikan 10 percakapan perkenalan dengan baik.</p>
            
            <div class="bg-slate-50 rounded-2xl p-4 my-5 border border-slate-100 flex justify-around items-center">
                <div>
                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Total Skor</span>
                    <span id="final-score" class="text-2xl font-extrabold text-amber-500">30 / 30 ⭐</span>
                </div>
                <div class="h-8 w-px bg-slate-200"></div>
                <div>
                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Percakapan</span>
                    <span class="text-2xl font-extrabold text-emerald-600">10 / 10</span>
                </div>
            </div>

            <div class="flex flex-col gap-2.5">
                <button id="btn-restart-all" class="w-full py-3.5 bg-slate-800 text-white font-bold rounded-2xl hover:bg-slate-900 transition shadow-lg shadow-slate-300">
                    <i class="fa-solid fa-rotate-right mr-2"></i>Ulangi Dari Awal
                </button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        // 10 Dialogs for Introduction Practice
        const CONVERSATION = [
            {
                id: 1,
                speaker: "A",
                name: "Alex",
                avatar: "👨‍🏫",
                textEn: "Hello! My name is Alex. What is your name?",
                textId: "Halo! Nama saya Alex. Siapa namamu?"
            },
            {
                id: 2,
                speaker: "B",
                name: "Budi (kamu)",
                avatar: "👦",
                textEn: "Hi Alex! My name is Budi. Nice to meet you.",
                textId: "Hai Alex! Nama saya Budi. Senang bertemu denganmu."
            },
            {
                id: 3,
                speaker: "A",
                name: "Alex",
                avatar: "👨‍🏫",
                textEn: "Nice to meet you too, Budi! Where are you from?",
                textId: "Senang bertemu denganmu juga, Budi! Dari mana asalmu?"
            },
            {
                id: 4,
                speaker: "B",
                name: "Budi (kamu)",
                avatar: "👦",
                textEn: "I am from Jakarta, Indonesia. How about you?",
                textId: "Saya dari Jakarta, Indonesia. Bagaimana denganmu?"
            },
            {
                id: 5,
                speaker: "A",
                name: "Alex",
                avatar: "👨‍🏫",
                textEn: "I am from Sydney, Australia. What do you do?",
                textId: "Saya dari Sydney, Australia. Apa pekerjaanmu?"
            },
            {
                id: 6,
                speaker: "B",
                name: "Budi (kamu)",
                avatar: "👦",
                textEn: "I am a high school student. And you?",
                textId: "Saya seorang siswa SMA. Dan kamu?"
            },
            {
                id: 7,
                speaker: "A",
                name: "Alex",
                avatar: "👨‍🏫",
                textEn: "I am an English teacher! How old are you, Budi?",
                textId: "Saya seorang guru Bahasa Inggris! Berapa umurmu, Budi?"
            },
            {
                id: 8,
                speaker: "B",
                name: "Budi (kamu)",
                avatar: "👦",
                textEn: "I am sixteen years old. How old are you?",
                textId: "Saya berumur enam belas tahun. Berapa umur Anda?"
            },
            {
                id: 9,
                speaker: "A",
                name: "Alex",
                avatar: "👨‍🏫",
                textEn: "I am twenty eight years old. What are your hobbies?",
                textId: "Saya berumur 28 tahun. Apa hobi-hobimu?"
            },
            {
                id: 10,
                speaker: "B",
                name: "Budi (kamu)",
                avatar: "👦",
                textEn: "I like playing football and learning English with you.",
                textId: "Saya suka bermain sepak bola dan belajar bahasa Inggris bersamamu."
            }
        ];

        // State variables
        let currentStepIndex = 0;
        let showTranslation = true;
        let ttsSpeed = 0.9;
        let userScores = new Array(CONVERSATION.length).fill(0);
        let userAudioBlobs = new Array(CONVERSATION.length).fill(null);
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recognition = null;

        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const progressBar = document.getElementById('progress-bar');
        const stepCounter = document.getElementById('step-counter');
        const btnToggleTrans = document.getElementById('btn-toggle-trans');
        const btnToggleSpeed = document.getElementById('btn-toggle-speed');
        const speedLabel = document.getElementById('speed-label');
        const btnClose = document.getElementById('btn-close');
        const recordingToast = document.getElementById('recording-toast');
        const modalCompletion = document.getElementById('modal-completion');
        const btnRestartAll = document.getElementById('btn-restart-all');
        const finalScoreEl = document.getElementById('final-score');

        // Web Speech Recognition Initialization
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let speechSupported = !!SpeechRecognition;

        if (speechSupported) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = false;
        }

        // Web Audio API for feedback chimes
        function playChime(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'star') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.25); // A5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch (e) {
                // Audio context fallbacks handled gracefully
            }
        }

        // TTS Engine (Native Text to Speech)
        function speakText(text, onEndCallback = null) {
            if (!('speechSynthesis' in window)) {
                alert('Browser Anda tidak mendukung Web Speech Synthesis.');
                if (onEndCallback) onEndCallback();
                return;
            }

            window.speechSynthesis.cancel(); // Stop any previous speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = ttsSpeed;

            // Try selecting a natural English voice
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Daniel')));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            if (onEndCallback) {
                utterance.onend = onEndCallback;
                utterance.onerror = onEndCallback;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Clean text string for comparison
        function sanitizeText(str) {
            return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
        }

        // Calculate speech matching score & word-level analysis
        function evaluateSpeech(targetText, recognizedText) {
            const cleanTargetWords = sanitizeText(targetText).split(/\s+/);
            const cleanUserWords = sanitizeText(recognizedText).split(/\s+/);

            if (!recognizedText || cleanUserWords.length === 0 || cleanUserWords[0] === '') {
                // Default high demo score if speech recognition is unsupported or quiet
                return {
                    stars: 3,
                    title: "Wow, kamu juara!",
                    wordScores: cleanTargetWords.map(w => ({ word: w, correct: true }))
                };
            }

            let matchCount = 0;
            const wordScores = cleanTargetWords.map(targetWord => {
                const matched = cleanUserWords.includes(targetWord);
                if (matched) matchCount++;
                return {
                    word: targetWord,
                    correct: matched
                };
            });

            const accuracyRatio = matchCount / Math.max(cleanTargetWords.length, 1);
            let stars = 3;
            let title = "Wow, kamu juara!";

            if (accuracyRatio >= 0.8) {
                stars = 3;
                title = "Wow, kamu juara!";
            } else if (accuracyRatio >= 0.4) {
                stars = 2;
                title = "Bagus Sekali!";
            } else {
                stars = 1;
                title = "Hampir Benar, Coba Lagi!";
            }

            return { stars, title, wordScores };
        }

        // Main function to re-render chat items
        function renderChats() {
            chatContainer.innerHTML = '';

            for (let i = 0; i <= currentStepIndex; i++) {
                const item = CONVERSATION[i];
                const isCurrent = (i === currentStepIndex);
                const isUser = item.speaker === 'B';

                const wrapper = document.createElement('div');
                wrapper.className = `w-full flex flex-col ${isUser ? 'items-end' : 'items-start'} animate-bubble mb-2`;

                // Avatar + Name Header above bubble
                const nameHeader = `
                    <div class="flex items-center gap-1.5 mb-1 px-1 ${isUser ? 'flex-row-reverse' : ''}">
                        <span class="text-base">${item.avatar}</span>
                        <span class="text-xs font-bold text-slate-500">${item.name}</span>
                    </div>
                `;

                // Single Speech Bubble container
                const bubble = document.createElement('div');
                bubble.className = `max-w-[88%] sm:max-w-[78%] rounded-3xl p-5 border shadow-sm transition-all duration-300 ${
                    isUser 
                        ? 'bg-white border-slate-200 text-slate-800 rounded-tr-sm' 
                        : 'bg-white border-slate-200 text-slate-800 rounded-tl-sm'
                }`;

                // Speech text inside bubble
                let bubbleHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <div class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
                                "${item.textEn}"
                            </div>
                            ${showTranslation ? `<div class="text-slate-400 italic text-sm sm:text-base mt-1.5 font-medium">"${item.textId}"</div>` : ''}
                        </div>
                        
                        ${!isUser ? `
                            <button onclick="playTargetTTS(${i})" title="Putar Suara" class="w-10 h-10 flex-shrink-0 bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-700 rounded-full flex items-center justify-center transition">
                                <i class="fa-solid fa-volume-high text-base"></i>
                            </button>
                        ` : ''}
                    </div>
                `;

                // For Speaker A (Alex): Show Next button if it's the current step
                if (!isUser && isCurrent) {
                    bubbleHTML += `
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-end">
                            <button onclick="nextStep()" class="px-6 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-sm rounded-full transition shadow-md flex items-center gap-2">
                                <span>Lanjut</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    `;
                }

                // For Speaker B (User): Show Ucapkan (Microphone) button or Evaluation Result Card
                if (isUser && isCurrent) {
                    const hasEvaluated = userScores[i] > 0;

                    if (!hasEvaluated) {
                        // Un-evaluated state: Ucapkan button
                        bubbleHTML += `
                            <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
                                <span class="text-xs font-semibold text-slate-400">Tekan tombol untuk berbicara</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="simulateSpeaking(${i})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-full transition" title="Simulasi tanpa Mikrofon">
                                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Simulasi
                                    </button>
                                    <button id="btn-mic-${i}" onclick="startSpeaking(${i})" class="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white font-extrabold text-sm rounded-full transition shadow-md shadow-red-200 flex items-center gap-2">
                                        <i class="fa-solid fa-microphone"></i>
                                        <span>Ucapkan</span>
                                    </button>
                                </div>
                            </div>
                        `;
                    } else {
                        // Evaluated State: Stars, Feedback message, underlined word breakdown, Dengar Asli, Suaramu, Coba Lagi, Lanjut
                        const evaluationData = evaluateSpeech(item.textEn, item.lastTranscript || item.textEn);
                        
                        bubbleHTML += `
                            <div class="mt-5 bg-slate-50 rounded-2xl border border-slate-100 p-4 text-center animate-bubble">
                                <!-- Stars -->
                                <div class="flex justify-center gap-1 mb-2 text-2xl">
                                    <span class="text-amber-400 animate-star star-delay-1">★</span>
                                    <span class="${evaluationData.stars >= 2 ? 'text-amber-400' : 'text-slate-300'} animate-star star-delay-2">★</span>
                                    <span class="${evaluationData.stars >= 3 ? 'text-amber-400' : 'text-slate-300'} animate-star star-delay-3">★</span>
                                </div>

                                <!-- Feedback Title -->
                                <div class="font-extrabold text-slate-800 text-lg mb-3">
                                    ${evaluationData.title}
                                </div>

                                <!-- Underlined Word Breakdown -->
                                <div class="flex flex-wrap justify-center gap-1.5 mb-4 px-2">
                                    ${evaluationData.wordScores.map(ws => `
                                        <span onclick="speakText('${ws.word}')" title="Klik untuk mendengar kata" class="px-1.5 py-0.5 rounded cursor-pointer text-sm font-bold border-b-2 transition ${
                                            ws.correct 
                                                ? 'border-emerald-500 text-emerald-700 bg-emerald-50 hover:bg-emerald-100' 
                                                : 'border-red-400 text-red-600 bg-red-50 hover:bg-red-100'
                                        }">
                                            ${ws.word}
                                        </span>
                                    `).join('')}
                                </div>

                                <!-- Audio Playback Controls -->
                                <div class="flex flex-wrap justify-center items-center gap-2 mb-4">
                                    <button onclick="playTargetTTS(${i})" class="px-4 py-2 bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold text-xs rounded-full transition flex items-center gap-1.5">
                                        <i class="fa-solid fa-volume-high"></i>
                                        <span>Dengar Asli</span>
                                    </button>
                                    <button onclick="playUserAudio(${i})" class="px-4 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold text-xs rounded-full transition flex items-center gap-1.5">
                                        <i class="fa-solid fa-play"></i>
                                        <span>Suaramu</span>
                                    </button>
                                </div>

                                <!-- Navigation Action Buttons -->
                                <div class="flex justify-center items-center gap-2 pt-2 border-t border-slate-200/60">
                                    <button onclick="retryStep(${i})" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs rounded-full transition flex items-center gap-1.5 shadow-sm">
                                        <i class="fa-solid fa-rotate-left"></i>
                                        <span>Coba Lagi</span>
                                    </button>
                                    <button onclick="nextStep()" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs rounded-full transition flex items-center gap-1.5">
                                        <span>Lanjut</span>
                                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                wrapper.innerHTML = nameHeader;
                bubble.innerHTML = bubbleHTML;
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
            }

            // Update Progress Bar & Counter
            const progressPct = ((currentStepIndex + 1) / CONVERSATION.length) * 100;
            progressBar.style.width = `${progressPct}%`;
            stepCounter.textContent = `${currentStepIndex + 1}/${CONVERSATION.length}`;

            // Auto scroll to active bottom item smoothly
            setTimeout(() => {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        // Play original TTS audio
        function playTargetTTS(index) {
            playChime('click');
            speakText(CONVERSATION[index].textEn);
        }

        // Play recorded user audio or synthetic backup
        function playUserAudio(index) {
            playChime('click');
            if (userAudioBlobs[index]) {
                const audio = new Audio(userAudioBlobs[index]);
                audio.play();
            } else {
                // Fallback if mic playback blob was not captured
                speakText(CONVERSATION[index].textEn);
            }
        }

        // Trigger real Speech Recognition + MediaRecorder
        async function startSpeaking(index) {
            playChime('click');
            const targetText = CONVERSATION[index].textEn;

            // Update UI state to recording
            recordingToast.classList.remove('opacity-0', 'pointer-events-none');
            
            // Try initializing MediaRecorder for genuine mic audio playback
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    userAudioBlobs[index] = URL.createObjectURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
            } catch (err) {
                console.log("MediaRecorder mic access error / fallback used:", err);
            }

            if (speechSupported && recognition) {
                let finalTranscript = '';

                recognition.onresult = (e) => {
                    finalTranscript = Array.from(e.results)
                        .map(result => result[0].transcript)
                        .join('');
                };

                recognition.onerror = (e) => {
                    console.log("Speech recognition error:", e.error);
                    stopAndEvaluate(index, targetText, targetText); // Graceful fallback
                };

                recognition.onend = () => {
                    stopAndEvaluate(index, targetText, finalTranscript || targetText);
                };

                try {
                    recognition.start();
                } catch (e) {
                    stopAndEvaluate(index, targetText, targetText);
                }
            } else {
                // Fallback simulation for unsupported browsers after 2 seconds
                setTimeout(() => {
                    stopAndEvaluate(index, targetText, targetText);
                }, 2000);
            }
        }

        // Fast simulation trigger for testing
        function simulateSpeaking(index) {
            playChime('click');
            recordingToast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                stopAndEvaluate(index, CONVERSATION[index].textEn, CONVERSATION[index].textEn);
            }, 1200);
        }

        // Stop recording & evaluate result
        function stopAndEvaluate(index, targetText, recognizedText) {
            recordingToast.classList.add('opacity-0', 'pointer-events-none');

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }

            CONVERSATION[index].lastTranscript = recognizedText;
            const evalRes = evaluateSpeech(targetText, recognizedText);
            userScores[index] = evalRes.stars;

            playChime('star');
            renderChats();
        }

        // Retry current user turn
        function retryStep(index) {
            playChime('click');
            userScores[index] = 0;
            userAudioBlobs[index] = null;
            CONVERSATION[index].lastTranscript = null;
            renderChats();
        }

        // Advance to next step
        function nextStep() {
            playChime('click');
            if (currentStepIndex < CONVERSATION.length - 1) {
                currentStepIndex++;
                renderChats();

                // If next speaker is Alex (A), automatically speak text
                if (CONVERSATION[currentStepIndex].speaker === 'A') {
                    setTimeout(() => {
                        speakText(CONVERSATION[currentStepIndex].textEn);
                    }, 300);
                }
            } else {
                // Completed all 10 chats
                showCompletionModal();
            }
        }

        // Show Completion Modal
        function showCompletionModal() {
            const totalEarnedStars = userScores.reduce((acc, curr) => acc + (curr > 0 ? curr : 3), 0);
            const maxStars = CONVERSATION.length * 3;
            
            finalScoreEl.textContent = `${totalEarnedStars} / ${maxStars} ⭐`;
            
            modalCompletion.classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-card').classList.remove('scale-95');
            document.getElementById('modal-card').classList.add('scale-100');
        }

        // Reset conversation back to start
        function resetAll() {
            playChime('click');
            currentStepIndex = 0;
            userScores = new Array(CONVERSATION.length).fill(0);
            userAudioBlobs = new Array(CONVERSATION.length).fill(null);
            CONVERSATION.forEach(c => c.lastTranscript = null);

            modalCompletion.classList.add('opacity-0', 'pointer-events-none');
            renderChats();

            // Speak first line automatically
            setTimeout(() => {
                speakText(CONVERSATION[0].textEn);
            }, 400);
        }

        // Event Listeners
        btnToggleTrans.addEventListener('click', () => {
            playChime('click');
            showTranslation = !showTranslation;
            btnToggleTrans.classList.toggle('bg-amber-100', showTranslation);
            btnToggleTrans.classList.toggle('border-amber-400', showTranslation);
            renderChats();
        });

        btnToggleSpeed.addEventListener('click', () => {
            playChime('click');
            if (ttsSpeed === 0.9) {
                ttsSpeed = 0.75;
                speedLabel.textContent = "Kecepatan: 0.75x (Pelan)";
            } else if (ttsSpeed === 0.75) {
                ttsSpeed = 1.0;
                speedLabel.textContent = "Kecepatan: 1.0x (Normal)";
            } else {
                ttsSpeed = 0.9;
                speedLabel.textContent = "Kecepatan: 0.9x";
            }
        });

        btnClose.addEventListener('click', () => {
            if (confirm("Apakah Anda ingin mengulangi percakapan dari awal?")) {
                resetAll();
            }
        });

        btnRestartAll.addEventListener('click', resetAll);

        // Pre-load voices on browser ready
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Initialize application on load
        window.addEventListener('load', () => {
            renderChats();
            // Automatically play Alex's opening greeting after short delay
            setTimeout(() => {
                speakText(CONVERSATION[0].textEn);
            }, 600);
        });
    </script>
</body>
</html>
