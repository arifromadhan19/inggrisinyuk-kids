# Header standar reverse proxy ke portal — dipakai deploy/nginx.conf.
# Pasang: sudo cp deploy/nginx-proxy-snippet.conf /etc/nginx/snippets/inggrisinyuk-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;              # dibaca ADMIN_IP_ALLOWLIST
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
