# nginx — InggrisinYuk Kids (app anak + portal di SATU domain).
# Pasang: sudo cp deploy/nginx.conf /etc/nginx/sites-available/inggrisinyuk-kids
# lalu ganti 2 placeholder di bawah (lihat DEPLOY.md langkah 8):
#   DOMAINMU          -> domain kamu, mis. inggrisinyuk.com (www.DOMAINMU ikut)
#   GANTI_ADMIN_GATE  -> nilai ADMIN_GATE di portal/.env
# HTTPS (443) ditambahkan otomatis oleh certbot.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINMU www.DOMAINMU;

    # www -> tanpa www: login & progres anak tersimpan per alamat (localStorage),
    # jadi semua orang harus memakai SATU alamat yang sama.
    if ($host = www.DOMAINMU) {
        return 301 $scheme://DOMAINMU$request_uri;
    }

    root /srv/inggrisinyuk-kids/app/public;
    index index.html;

    # Body sinkron progres bisa lebih dari default 1 MB.
    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- Portal (Next.js di 127.0.0.1:3000) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/inggrisinyuk-proxy.conf;
    }
    # Panel admin CS: URL rahasia /<ADMIN_GATE>/ + aset Next.js-nya.
    location ^~ /GANTI_ADMIN_GATE {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/inggrisinyuk-proxy.conf;
    }
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/inggrisinyuk-proxy.conf;
    }

    # ---- App anak (file statis) ----
    # bundle.js & styles.css tidak ber-hash: selalu cek versi baru (ETag).
    location ~* ^/(bundle\.js|styles\.css|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* ^/(img|audio)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # SPA fallback: /belajar, /daftar, /game/... -> index.html (router client).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
